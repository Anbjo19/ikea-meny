<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restaurantmeny</title>
<link rel="stylesheet" href="./assets/ikea-labels.css" />
<style>
  :root{
    /* Fast portrett-scene: hele visningen tegnes i 1080×1920 og skaleres
       proporsjonalt inn i det faktiske vinduet (se fitStage() i JS). Alle
       mål i stilarket som før var vw/vh er nå relative til scenen, ikke
       nettleservinduet — derfor ser tavlen identisk ut på en portrettskjerm
       uansett oppløsning, og blir bare mindre (med hvit kant rundt) i en
       vanlig liggende nettleser i stedet for å bli "responsiv". */
    --stage-w: 1080px;
    --stage-h: 1920px;
    --vw: calc(var(--stage-w) / 100);
    --vh: calc(var(--stage-h) / 100);
    /* Offisielle IKEA-fargetokens, se assets/ikea-labels.css for kilde */
    --ikea-blue:#0058a3;
    --ikea-blue-dark:#003d73;
    --ikea-yellow:#ffdb00;
    --ikea-family-blue:#007cc1;
    --ink:#111111;
    --paper:#ffffff;
    --muted:#5b6b82;
    /* Logoen nede til høyre: 22,78 % av breddan, høyden regnet ut fra
       IKEA-logoens egne proporsjoner (98.36 × 40 i SVG-en), og selve den
       utregnede høyden brukt som luft rundt (100 % av høyden, som bedt om). */
    --logo-w: calc(22.78 * var(--vw));
    --logo-h: calc(var(--logo-w) * 40 / 98.36);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto IKEA","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    width:var(--stage-w); height:var(--stage-h);
    background:var(--paper);
    position:absolute; top:0; left:0;
    transform-origin:top left;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; flex-direction:column; align-items:flex-start;
    gap: calc(0.9 * var(--vh));
    background:var(--ikea-yellow);
    color:var(--ink);
    padding: calc(2.2 * var(--vh)) calc(4.8 * var(--vw)) calc(2 * var(--vh));
    flex:0 0 auto;
  }
  header .brand{
    flex:0 0 auto;
    max-width:100%;
  }
  header .brand .hej{
    font-size:clamp(26px, calc(4.2 * var(--vw)), 60px);
    font-weight:900;
    line-height:1.08;
    white-space:nowrap; /* hele hilsenen på én linje */
  }
  /* Butikkikon + varehusnavn (f.eks. "IKEA Slependen") på linja under
     hilsenen — gjesterettet, i motsetning til butikkode/tidsstempel som
     lå i headeren før. */
  header .store-name{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:0.4em;
    white-space:nowrap;
    font-size:clamp(15px, calc(1.9 * var(--vw)), 26px);
    font-weight:700;
  }
  /* Skapa-ikonet "store" foran varehusnavnet */
  header .store-name .store-icon{
    width:1.1em;
    height:1.1em;
    flex:0 0 auto;
    display:block;
  }
  /* Tidsstempel for personalet: liten og diskret nede til venstre, så det
     er lett å sjekke at dataene er ferske uten at det tar plass på tavlen. */
  .updated-stamp{
    position:absolute;
    left:calc(4.8 * var(--vw));
    bottom:calc(1.2 * var(--vh));
    font-size:clamp(9px, calc(0.85 * var(--vw)), 12px);
    color:var(--muted);
    opacity:0.5;
    z-index:20;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Logo, nede til høyre: 22,78 % av bredden, med luft rundt
     tilsvarende 100 % av logoens (utregnede) høyde ---------- */
  .corner-logo{
    position:absolute;
    right: var(--logo-h);
    bottom: var(--logo-h);
    width: var(--logo-w);
    height:auto;
    z-index:20;
  }
  #logoFallback{
    position:absolute;
    right: var(--logo-h);
    bottom: var(--logo-h);
    z-index:20;
    background:var(--ikea-yellow);
    color:var(--ikea-blue-dark);
    font-weight:900;
    font-size:calc(var(--logo-h) * 0.42);
    padding:0.3em 0.5em;
    border-radius:5px;
    letter-spacing:0.5px;
  }

  /* ---------- Board (all retter, én skjerm) ---------- */
  #boardViewport{
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    padding: calc(2.2 * var(--vh)) calc(4.8 * var(--vw)) calc(2.2 * var(--vh));
  }
  /* To egne kolonner (i stedet for CSS multi-column) fordi de to sidene skal
     ha ulik bunnklaring: venstre kolonne har ingen logo og kan derfor gå
     nesten helt ned, mens høyre kolonne må stoppe med full luft over
     hjørnelogoen. board-col-right sin egen padding-bottom sørger for det —
     se splitCategoriesIntoColumns() i JS, som fordeler kategoriene mellom
     de to før rendering. */
  #board{
    display:flex;
    align-items:flex-start;
    gap: calc(2.6 * var(--vw));
    width:100%;
  }
  .board-col{
    flex:1 1 0;
    min-width:0;
  }
  /* Kolonnen som deler høyrekant med logoen (høyre kolonne i to-spalte-
     modus, eneste kolonne i én-spalte-modus) må stoppe med full luft over
     hjørnelogoen: plass til logoen (egen høyde + luften under den). */
  .board-col.clears-logo{
    padding-bottom: calc(var(--logo-h) * 2.2);
  }
  /* Liten etikett "IKEA Family-pris" rett foran den blå prisen, så hver
     rett forklarer seg selv uten egen forklaringsrad. */
  .item .fam-label{
    font-size:clamp(10px, calc(1.15 * var(--vw)), 14px);
    font-weight:700;
    color:var(--ikea-family-blue);
    margin-right:0.45em;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .category{
    break-inside: avoid-column;
    margin-bottom: calc(1.1 * var(--vh));
  }
  .category h2{
    margin:0 0 calc(0.45 * var(--vh)) 0;
    font-size:clamp(21px, calc(2.45 * var(--vw)), 32px);
    font-weight:900;
    color:var(--ink);
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding-bottom:calc(0.1 * var(--vh));
    break-after: avoid-column;
    display:flex;
    align-items:center;
    gap:0.35em;
  }
  .cat-icon{
    flex:0 0 auto;
    width:0.95em;
    height:0.95em;
    display:block;
  }
  /* Grid i stedet for ren flex-rad: kolonne 1 (tittel/beskrivelse/
     allergener) og kolonne 2 (priser) er de samme radene ned gjennom
     hele retten, slik at beskrivelsen aldri går lenger til høyre enn der
     den prikkete linja stopper (dvs. der priskolonnen begynner). */
  .item{
    display:grid;
    grid-template-columns: 1fr auto;
    column-gap:0.6em;
    padding: calc(0.22 * var(--vh)) 0;
    break-inside: avoid-column;
  }
  .item .row-name{
    grid-column:1;
    display:flex;
    align-items:baseline;
    gap:0.5em;
    min-width:0;
  }
  .item .name{
    flex:0 1 auto;
    font-weight:700;
    font-size:clamp(18px, calc(2.2 * var(--vw)), 28px);
    white-space:nowrap;
  }
  .se-flag{
    display:inline-block;
    width:1.7em;
    height:1.0625em;
    margin-left:0.4em;
    vertical-align:middle;
    border-radius:0;
    flex:0 0 auto;
  }
  /* "Nyhet" rett etter tittelen, midtstilt vertikalt ift. tittelteksten
     (ikea.com selv har den over tittelen, men vi prøver den etter her).
     Fargen/formen (heldekket pille eller ren tekst) kommer fra
     .ikea-message--new i ikea-labels.css. */
  .item .new-label{
    display:inline-block;
    margin-left:0.5em;
    vertical-align:middle;
    font-size:clamp(10px, calc(1.05 * var(--vw)), 14px);
  }
  .item .desc{
    grid-column:1;
    min-width:0;
    margin-top:calc(0.08 * var(--vh));
    white-space:normal;
    overflow-wrap:break-word;
    font-size:clamp(14px, calc(1.5 * var(--vw)), 19px);
    color:var(--muted);
    line-height:1.16;
  }
  .item .allergens{
    grid-column:1;
    min-width:0;
    margin-top:calc(0.05 * var(--vh));
    white-space:normal;
    overflow-wrap:break-word;
    font-size:clamp(11px, calc(1.15 * var(--vw)), 15px);
    color:var(--muted);
    opacity:0.75;
    font-style:italic;
    line-height:1.14;
  }
  /* Allergenene henger på slutten av beskrivelsen (samme linje når det er
     plass) i stedet for å alltid ta en egen linje — sparer mye høyde. */
  .item .desc .allergens{
    display:inline;
    margin-left:0.55em;
    font-size:0.78em;
  }
  .item .leader{
    flex:1 1 auto;
    min-width:0.6em;
    border-bottom: 2px dotted #98a2b3;
    height:0.55em;
    align-self:flex-end;
    margin-bottom:0.3em;
  }
  .item .prices{
    grid-column:2;
    grid-row:1;
    align-self:baseline;
    display:flex;
    gap:0.6em;
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .item .family{
    font-weight:800;
    font-size:clamp(16px, calc(2.0 * var(--vw)), 26px);
    color:var(--ikea-family-blue);
    min-width:2.6em;
    text-align:right;
  }
  .item .regular{
    font-weight:900;
    font-size:clamp(18px, calc(2.2 * var(--vw)), 28px);
    color:var(--ink);
    min-width:2.8em;
    text-align:right;
  }
  /* Ekte IKEA-prislapp (gul/rød) for retter merket isBti — se assets/ikea-labels.css */
  .item .regular.ikea-price--bti{
    min-width:auto;
    font-size:clamp(17px, calc(1.85 * var(--vw)), 23px);
    border-radius:2px;
  }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center; color:var(--muted);
    gap:calc(1.2 * var(--vh)); padding: calc(4 * var(--vh));
  }
  .empty-state .big{
    font-size:clamp(18px,calc(2.6 * var(--vw)),32px); color:var(--ikea-blue-dark); font-weight:800;
  }

</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="hej">Hej! Velkommen til restauranten</span>
    </div>
    <div class="store-name" id="storeLine" hidden>
      <img class="store-icon" src="assets/icons/store.svg" alt="" aria-hidden="true" />
      <span id="storeName"></span>
    </div>
  </header>
  <div id="boardViewport">
    <div class="empty-state">
      <div class="big">Laster meny …</div>
      <div>Henter data fra menu-data.json</div>
    </div>
  </div>
  <img class="corner-logo" src="./assets/ikea-logo.svg" alt="IKEA"
       onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='';" />
  <span id="logoFallback" style="display:none;">IKEA</span>
  <div class="updated-stamp" id="updatedStamp"></div>
</div>

<script>
(function () {
  "use strict";

  // ---- Konfigurasjon -------------------------------------------------
  // Hvilken butikk skal vises? Uten ?store i URL-en brukes menu-data.json
  // som normalt (fint for en skjerm som alltid står i samme butikk). Med
  // f.eks. ?store=091 i URL-en leses i stedet menu-data-091.json — slik
  // kan samme menu.html-utrulling brukes til flere butikker, hver med sin
  // egen skjerm-URL. Generer filen med:
  //   python3 fetch_menu.py --store 091 --out menu-data-091.json
  var urlParams = new URLSearchParams(window.location.search);
  var storeOverride = (urlParams.get("store") || "").trim();
  var DATA_URL = storeOverride
    ? "./menu-data-" + encodeURIComponent(storeOverride) + ".json"
    : "./menu-data.json";
  var DATA_POLL_MS = 5 * 60 * 1000;        // sjekk om menu-data.json er oppdatert
  var FULL_RELOAD_MS = 6 * 60 * 60 * 1000; // last hele siden på nytt (holder skjermen frisk)
  var MIN_SCALE = 0.45;                    // laveste vi skalerer tavlen ned til (to spalter)
  var MAX_SCALE = 1.5;                     // høyeste vi skalerer tavlen opp til (én spalte)

  var appEl = document.getElementById("app");
  var boardViewportEl = document.getElementById("boardViewport");
  var storeLineEl = document.getElementById("storeLine");
  var storeNameEl = document.getElementById("storeName");
  var updatedStampEl = document.getElementById("updatedStamp");

  var lastGeneratedAt = null;
  var lastMenu = null;

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Grov vekting av hvor mye plass en kategori tar, brukt til å dele
  // kategoriene mellom venstre/høyre kolonne omtrent likt (samme idé som
  // CSS sin egen column-balance, men vi trenger ett kuttpunkt selv siden
  // kolonnene nå er to separate elementer, ikke CSS multi-column).
  function estimateCategoryWeight(cat) {
    var w = 1.6; // kategori-tittel
    (cat.items || []).forEach(function (it) {
      w += 1; // navn/pris-rad
      if (it.description) w += Math.max(1, Math.ceil(it.description.length / 44));
      var hasAllergens =
        (it.allergens && it.allergens.length) || (it.allergensTraces && it.allergensTraces.length);
      if (hasAllergens) w += 1;
    });
    return w;
  }

  function splitCategoriesIntoColumns(categories) {
    var withWeight = categories
      .filter(function (c) {
        return c.items && c.items.length;
      })
      .map(function (c) {
        return { cat: c, weight: estimateCategoryWeight(c) };
      });
    var total = withWeight.reduce(function (sum, c) {
      return sum + c.weight;
    }, 0);

    var left = [];
    var right = [];
    var acc = 0;
    withWeight.forEach(function (c) {
      // Fyll venstre kolonne til vi passerer halvparten av totalvekten,
      // deretter resten i høyre — gir samme lesevennlige rekkefølge
      // (ovenfra og ned, deretter neste kolonne) som før.
      if (acc < total / 2) {
        left.push(c.cat);
      } else {
        right.push(c.cat);
      }
      acc += c.weight;
    });
    // Ikke la høyre kolonne stå helt tom hvis alt havnet i venstre (svært
    // få kategorier) — flytt i så fall siste kategori over.
    if (!right.length && left.length > 1) {
      right.push(left.pop());
    }
    return [left, right];
  }

  // Ikon ved siden av hver kategori-tittel. 8 av 9 er hentet fra IKEAs eget
  // Skapa-designsystem (https://skapa.ikea.net/foundations/all-icons/, SVG
  // byte for byte som i Skapa). Smørbrød/wraps finnes ikke i Skapa (ingen
  // sandwich-/brød-ikon der), så det er hentet fra Lucide (lucide.dev,
  // MIT-lisens) i tilnærmet samme enkle strek-stil.
  var CATEGORY_ICONS = {
    "breakfast": "assets/icons/egg-cup.svg",
    "mains": "assets/icons/cutlery.svg",
    "childrens-menu": "assets/icons/balloon.svg",
    "sandwiches-wraps": "assets/icons/sandwich.svg",
    "cold-starter": "assets/icons/seafood.svg",
    "salads": "assets/icons/salad.svg",
    "side-dishes": "assets/icons/hand-with-plate.svg",
    "desserts-pastries": "assets/icons/piece-of-cake.svg",
    "hot-beverages": "assets/icons/hot-drink.svg"
  };

  function renderCategoryList(categories) {
    var html = "";
    categories.forEach(function (cat) {
      if (!cat.items || !cat.items.length) return;
      var iconSrc = CATEGORY_ICONS[cat.slug];
      var iconHtml = iconSrc
        ? '<img class="cat-icon" src="' + iconSrc + '" alt="" aria-hidden="true">'
        : "";
      html += '<div class="category"><h2>' + iconHtml + escapeHtml(cat.name) + "</h2>";
      cat.items.forEach(function (it) {
        var family = it.familyPriceFormatted
          ? '<span class="family"><span class="fam-label">IKEA Family-pris</span>' +
            escapeHtml(it.familyPriceFormatted) + "</span>"
          : '<span class="family"></span>';
        var regular = it.regularPriceFormatted
          ? escapeHtml(it.regularPriceFormatted)
          : it.regularPrice != null
          ? escapeHtml(it.regularPrice + ",-")
          : "";
        var regularCls = "regular" + (it.isBti ? " ikea-price--bti" : "");
        var descHtml = ""; // settes etter at allergenHtml er kjent
        var seFlagHtml = it.isSwedishClassic
          ? '<svg class="se-flag" viewBox="0 0 16 10" aria-label="Tradisjonell svensk klassiker" role="img">' +
            '<rect width="16" height="10" fill="#006AA7"/>' +
            '<rect x="5" width="2" height="10" fill="#FECC00"/>' +
            '<rect y="4" width="16" height="2" fill="#FECC00"/>' +
            "</svg>"
          : "";
        var newLabelHtml = it.isNew ? '<span class="ikea-message--new new-label">Nyhet</span>' : "";
        var allergenBits = [];
        if (it.allergens && it.allergens.length) {
          allergenBits.push("Inneholder: " + it.allergens.join(", "));
        }
        if (it.allergensTraces && it.allergensTraces.length) {
          allergenBits.push("kan inneholde spor av: " + it.allergensTraces.join(", "));
        }
        var allergenSpan = allergenBits.length
          ? '<span class="allergens">' + escapeHtml(allergenBits.join(" — ")) + "</span>"
          : "";
        var allergenHtml = "";
        if (it.description) {
          descHtml = '<div class="desc">' + escapeHtml(it.description) + allergenSpan + "</div>";
        } else if (allergenSpan) {
          allergenHtml = '<div class="allergens">' + escapeHtml(allergenBits.join(" — ")) + "</div>";
        }
        html +=
          '<div class="item">' +
          '<div class="row-name">' +
          '<span class="name">' + escapeHtml(it.name) + newLabelHtml + seFlagHtml + "</span>" +
          '<span class="leader"></span>' +
          "</div>" +
          '<span class="prices">' + family + '<span class="' + regularCls + '">' + regular + "</span></span>" +
          descHtml +
          allergenHtml +
          "</div>";
      });
      html += "</div>";
    });
    return html;
  }

  // Én eller to spalter? Får hele menyen plass i én spalte uten å skaleres
  // ned (kort meny, f.eks. Karl Johan), bruker vi én spalte og skalerer
  // heller OPP (inntil MAX_SCALE) så tavlen fyller skjermen. Ellers to
  // spalter som skaleres ned akkurat nok til at alt får plass.
  function renderBoard(menu) {
    var categories = menu.categories || [];
    if (!categories.length) {
      boardViewportEl.innerHTML =
        '<div class="empty-state"><div class="big">Ingen retter tilgjengelig akkurat nå</div>' +
        "<div>Sjekk at menu-data.json er generert (kjør fetch_menu.py).</div></div>";
      return;
    }

    // Forsøk 1: én spalte, naturlig størrelse.
    boardViewportEl.innerHTML =
      '<div id="board" class="single">' +
      '<div class="board-col clears-logo">' + renderCategoryList(categories) + "</div>" +
      "</div>";
    if (fitBoard(true)) return;

    // Forsøk 2: to spalter, skalert ned ved behov.
    var cols = splitCategoriesIntoColumns(categories);
    boardViewportEl.innerHTML =
      '<div id="board">' +
      '<div class="board-col board-col-left">' + renderCategoryList(cols[0]) + "</div>" +
      '<div class="board-col board-col-right clears-logo">' + renderCategoryList(cols[1]) + "</div>" +
      "</div>";
    fitBoard(false);
  }

  // ---- Skaler tavlen slik at ALT vises uten scrolling --------------------
  // singleColumn=true: returnerer false hvis innholdet ikke får plass i
  // naturlig størrelse (da må vi over på to spalter), ellers skaleres det
  // opp inntil MAX_SCALE. singleColumn=false: skaleres ned til det passer.
  function fitBoard(singleColumn) {
    var board = document.getElementById("board");
    if (!board) return false;
    board.style.transform = "none";
    board.style.width = "100%";

    // clientHeight inkluderer boardViewport sin egen padding (bl.a. plassen
    // reservert til hjørnelogoen) — den må trekkes fra for å finne hvor mye
    // høyde #board faktisk har å bruke, ellers skalerer vi for lite ned og
    // innholdet kan overlappe logoen.
    var cs = window.getComputedStyle(boardViewportEl);
    var vPad = parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0);
    var availH = boardViewportEl.clientHeight - vPad;
    var naturalH = board.scrollHeight;
    if (naturalH === 0) return true;

    if (singleColumn && naturalH > availH) return false;
    if (!singleColumn && naturalH <= availH) return true;

    // Skalering og bredde henger sammen: skaleres tavlen ned, blir den
    // tilsvarende bredere (width = 100/scale %), og bredere spalter gir
    // færre linjebrudd i beskrivelsene — altså lavere høyde og rom for
    // litt mindre nedskalering. Derfor måles høyden på nytt noen ganger
    // til skaleringen har stabilisert seg, i stedet for å bruke det
    // første (for pessimistiske) målet fra den smale tavlen.
    var scale = 1;
    for (var i = 0; i < 6; i++) {
      var next = (availH / naturalH) * 0.985;
      next = singleColumn ? Math.min(MAX_SCALE, next) : Math.max(MIN_SCALE, next);
      if (Math.abs(next - scale) < 0.003) break;
      scale = next;
      board.style.transformOrigin = "top left";
      board.style.width = 100 / scale + "%";
      board.style.transform = "scale(" + scale + ")";
      naturalH = board.scrollHeight;
      if (naturalH === 0) break;
    }
    // Siste sikkerhetssjekk: den siste målingen kan være litt høyere enn
    // den skaleringen ble regnet ut fra (linjebrudd flytter seg når
    // bredden endres). Da må vi ned det lille hakket til, ellers stikker
    // bunnen av tavlen ut i marginen.
    if (naturalH * scale > availH) {
      scale = (availH / naturalH) * 0.985;
      board.style.width = 100 / scale + "%";
      board.style.transform = "scale(" + scale + ")";
    }
    if (singleColumn && scale <= 1.001) {
      board.style.transform = "none";
      board.style.width = "100%";
    }
    return true;
  }

  // ---- Skaler hele scenen (1080×1920) proporsjonalt inn i vinduet ---------
  // På en portrettskjerm med samme forhold fyller scenen hele skjermen;
  // i et liggende vindu sentreres den med hvit kant på sidene.
  function fitStage() {
    var cs = window.getComputedStyle(appEl);
    var stageW = parseFloat(cs.width) || 1080;
    var stageH = parseFloat(cs.height) || 1920;
    var scale = Math.min(window.innerWidth / stageW, window.innerHeight / stageH);
    var offX = Math.max(0, (window.innerWidth - stageW * scale) / 2);
    var offY = Math.max(0, (window.innerHeight - stageH * scale) / 2);
    appEl.style.transform = "translate(" + offX + "px," + offY + "px) scale(" + scale + ")";
  }
  fitStage();

  // Ved endret vindusstørrelse skaleres scenen på nytt. Tavlen selv trenger
  // ikke re-rendres — scenen er alltid 1080×1920 innvendig.
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitStage, 100);
  });

  // ---- Hent data ---------------------------------------------------------
  function loadMenu() {
    fetch(DATA_URL, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (menu) {
        if (menu.generatedAt === lastGeneratedAt) return; // ingenting nytt
        lastGeneratedAt = menu.generatedAt;

        // Butikknavn i headeren (gjesterettet). Butikkode og tidsstempel er
        // internt og havner i stedet som en liten linje nede til venstre.
        var store = menu.store || {};
        storeNameEl.textContent = store.name || "";
        storeLineEl.hidden = !store.name;

        var stampBits = [];
        if (store.code) stampBits.push("Butikk " + store.code);
        if (menu.generatedAt) {
          var d = new Date(menu.generatedAt);
          if (!isNaN(d)) {
            stampBits.push(
              "Oppdatert " +
                d.toLocaleDateString("no-NO") +
                " " +
                d.toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" })
            );
          }
        }
        updatedStampEl.textContent = stampBits.join(" · ");

        lastMenu = menu;
        renderBoard(menu);
      })
      .catch(function (err) {
        console.error("Kunne ikke laste " + DATA_URL + ":", err);
        if (!document.getElementById("board")) {
          var howTo = storeOverride
            ? "Kjør <code>python3 fetch_menu.py --store " + escapeHtml(storeOverride) +
              " --out menu-data-" + escapeHtml(storeOverride) + ".json</code> i denne mappen."
            : "Kjør <code>python3 fetch_menu.py</code> i denne mappen.";
          boardViewportEl.innerHTML =
            '<div class="empty-state"><div class="big">Fant ikke ' + escapeHtml(DATA_URL) + "</div>" +
            "<div>" + howTo + " Server mappen med en lokal webserver " +
            "(ikke åpne filen direkte).</div></div>";
        }
      });
  }

  loadMenu();
  setInterval(loadMenu, DATA_POLL_MS);
  setTimeout(function () {
    window.location.reload();
  }, FULL_RELOAD_MS);
})();
</script>
</body>
</html>
